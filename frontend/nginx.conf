map $uri $speakmate_cache_control {
  default "no-cache";
  ~^/api/ "";
  ~^/health/ "";
  ~^/assets/ "public, max-age=31536000, immutable";
  ~^/reset-password$ "no-store";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  set_real_ip_from ${TRUSTED_INGRESS_CIDR};
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  add_header Cache-Control $speakmate_cache_control always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self'; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; script-src 'self'; style-src 'self'; worker-src 'self'" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=()" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  location ~ ^/api/v1/conversations/[^/]+/transcriptions$ {
    client_max_body_size 10m;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    # Production Uvicorn trusts this private-network proxy. Overwrite, rather
    # than append, so an Internet client cannot inject a rate-limit identity.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /health/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    # Keep health-route forwarding under the same anti-spoofing boundary.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /assets/ { try_files $uri =404; }

  # Reset tokens now use URL fragments, which are not sent to the server. Disable
  # access logging here as well so legacy query-token links cannot enter logs.
  location = /reset-password {
    access_log off;
    try_files $uri $uri/ /index.html;
  }

  location / { try_files $uri $uri/ /index.html; }
  location = /service-worker.js { try_files $uri =404; }
}
