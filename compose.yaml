services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spoken_english
      POSTGRES_USER: spoken_english
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spoken_english -d spoken_english"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [postgres-data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [redis-data:/data]
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &backend-environment
      SPOKEN_ENGLISH_ENVIRONMENT: development
      SPOKEN_ENGLISH_DATABASE_URL: postgresql+psycopg://spoken_english:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/spoken_english
      SPOKEN_ENGLISH_REDIS_URL: redis://redis:6379/0
      SPOKEN_ENGLISH_JWT_SECRET: local-compose-signing-key-at-least-32-bytes
      SPOKEN_ENGLISH_AUTO_CREATE_TABLES: "false"
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    build: .
    environment:
      <<: *backend-environment
      SPOKEN_ENGLISH_REDIS_REQUIRED: "true"
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]
  worker:
    build: .
    command: ["python", "-m", "backend.app.cli.worker"]
    environment:
      <<: *backend-environment
      SPOKEN_ENGLISH_WORKER_ENABLED: "true"
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:8080"]
volumes:
  postgres-data: {}
  redis-data: {}
