name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m compileall -q backend examples
      - run: python -m ruff check backend examples
      - run: python -m mypy backend/app/core/config.py backend/app/db/session.py backend/app/distributed backend/app/jobs backend/app/storage
      - run: alembic upgrade head
        env:
          SPOKEN_ENGLISH_DATABASE_URL: sqlite:///./ci.db
          SPOKEN_ENGLISH_JWT_SECRET: ci-signing-key-at-least-32-bytes
      - run: alembic downgrade base
        env:
          SPOKEN_ENGLISH_DATABASE_URL: sqlite:///./ci.db
          SPOKEN_ENGLISH_JWT_SECRET: ci-signing-key-at-least-32-bytes
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pip-audit
      - run: python -m pip_audit .
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm audit --omit=dev
        working-directory: frontend
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t spoken-english-backend:ci .
      - run: docker build -t spoken-english-frontend:ci frontend
