services:
  migrate:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    command: ["alembic", "upgrade", "head"]
    env_file: [.env.production]
    restart: "no"
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    env_file: [.env.production]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.parse import urlparse; import urllib.request; from backend.app.core.config import get_settings; settings=get_settings(); request=urllib.request.Request('http://127.0.0.1:8000/health/ready', headers={'Host': urlparse(settings.public_api_url).netloc, 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    deploy:
      resources: {limits: {memory: 768M, cpus: "1.0"}}
  worker:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    command: ["python", "-m", "backend.app.cli.worker"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    env_file: [.env.production]
    depends_on:
      migrate: {condition: service_completed_successfully}
    deploy:
      replicas: 1
      resources: {limits: {memory: 512M, cpus: "0.5"}}
  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    environment:
      TRUSTED_INGRESS_CIDR: ${TRUSTED_INGRESS_CIDR:?Set TRUSTED_INGRESS_CIDR to the approved ingress network}
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    ports: ["127.0.0.1:8080:8080"]
    deploy:
      resources: {limits: {memory: 128M, cpus: "0.25"}}
