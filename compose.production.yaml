services:
  migrate:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    command: ["alembic", "upgrade", "head"]
    env_file: [.env.production]
    restart: "no"
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    env_file: [.env.production]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    deploy:
      resources: {limits: {memory: 768M, cpus: "1.0"}}
  worker:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    command: ["python", "-m", "backend.app.cli.worker"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    env_file: [.env.production]
    depends_on:
      migrate: {condition: service_completed_successfully}
    deploy:
      replicas: 1
      resources: {limits: {memory: 512M, cpus: "0.5"}}
  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    ports: ["8080:8080"]
    deploy:
      resources: {limits: {memory: 128M, cpus: "0.25"}}
